<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация | Сталкер РП</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.form{
    background:#1b1b1b;
    padding:40px;
    border-radius:15px;
    width:350px;
}

h1{
    text-align:center;
    color:#ff9800;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="form">

    <h1>Регистрация</h1>

    <form>
        <input type="text" placeholder="Логин" required>

        <input type="email" placeholder="Email" required>

        <input type="password" placeholder="Пароль" required>

        <button type="submit">
            Зарегистрироваться
        </button>
    </form>

</div>

</body>
</html>
